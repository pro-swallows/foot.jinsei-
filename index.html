 const o=ls.map(k=>[CT[k].fl+CT[k].lg+'で再起をかける',()=>{p.tried[k]=1;if(p.ovr>=TI[CT[k].t].thr-10||ch(.25)){p.tried={};go(k,mk(k),Math.max(.042,offer(k,p.ovr)*.6),1,'契約解除から'+CT[k].lg+'へ')}else{p.log.unshift('… '+CT[k].lg+'からオファーなし');release('オファー待ち')}}]);

function negotiate(){const y=+$('#cy').value,ask=+$('#ca').value,o=p.pending.o;if(!(ask>0))return;const r=ask/o,pr=C(1.05-(r-1)*1.6+(p.eval-50)/200-(y>3?.05*(y-3):0),.03,.97);
 if(ch(pr)){p.sal=ask;p.cl=y;note('交渉成功！'+ct(y,ask));p.pending=null;render()}else if(r>1.5&&ch(.4))release('契約交渉が決裂');else{p.sal=o*.9;p.cl=1;note('交渉は不調…1年'+fm(o*.9)+'で更改');p.pending=null;render()}}
function market(o){
 const n=C(Math.round(R(0,5.4)+(p.ovr-60)/18),0,5),of=[],seen={},ks=Object.keys(CT).filter(k=>p.ovr>=TI[CT[k].t].thr-6||k==p.country);
 for(let i=0;i<n;i++){const k=ch(.35)?p.country:pk(ks),c=mk(k);if(seen[k+c]||(k==p.league&&c==p.team))continue;seen[k+c]=1;of.push([k,c,Math.max(.042,offer(k,p.ovr,INFO[k+'|'+c].div)*R(.9,1.5)),RI(1,5)])}
 const op=[['現クラブに残留（'+ct(3,o*1.1)+'）',()=>{p.sal=o*1.1;p.cl=3;note('移籍市場に出るも残留');p.pending=null;render()}]];
 of.forEach(([k,c,s,y])=>op.unshift([CT[k].fl+' '+lgn(k,INFO[k+'|'+c].div)+' '+c+'：'+ct(y,s),()=>{go(k,c,s,y,'移籍：'+CT[k].fl+lgn(k,INFO[k+'|'+c].div)+'・'+c+'（'+ct(y,s)+'）')}]));
 if(!of.length)op.push(['他リーグに道を探す',()=>release('移籍市場でオファーなし')]);
 p.log.unshift(p.age+'歳: 移籍市場（'+of.length+'クラブからオファー）');p.pending={msg:'🔁 移籍市場！'+(of.length?of.length+'クラブからオファー。どうする？':'オファーはゼロ…'),opts:op};render()}
function renew(){
 if(p.age>=50)return finish('50歳で現役引退');if(p.age>=35&&p.ovr<TI[CT[p.league].t].thr-2&&ch(.5+(p.age-35)*.06))return finish('力尽きて現役引退');
 let lg=p.league,o=Math.max(CT[lg].t==1&&p.div==0?.3:.042,offer(lg,p.ovr,p.div)*(.75+p.eval/200)),y=RI(1,3);
 const fl=p.sal*(p.sal>1?.6:.75);if(p.sal>=.1&&o<fl){if(p.adj<-8&&p.age>24)return release('減俸制限を超える減額提示のため契約解除');o=fl}
 const set=(s,c,t)=>{p.sal=s;p.cl=c;note(t);p.pending=null;render()};
 const op=[['提示を受ける（'+ct(y,o)+'）',()=>set(o,y,'契約更改：'+ct(y,o))],['条件を交渉する（年数・金額を指定）',()=>{p.pending.form=1;render()}],['🔁 移籍市場に出る',()=>market(o)],['契約解除を希望する',()=>release('自らの希望')]];
 if(p.age>=35)op.push(['現役を引退する',()=>finish('現役引退')]);
 p.pending={msg:'📝 契約更新。成績を加味した評価はOVR換算'+Math.round(val())+'。クラブ提示は'+ct(y,o)+'（現在年俸'+fm(p.sal)+'）。',opts:op,o}}
function evt(){
 if(!ch(.45))return;const gk=p.pos=='GK',L=[],cl=(d,t)=>{p.eval=C(p.eval+d,0,100);note(t);p.pending=null;render()},set=(m,o)=>{p.pending={msg:m,opts:o};return 1};
 const cr=(pr,w,f)=>ch(C(pr,.1,.9))?cl(6,w+'で勝負！成功してチーム評価アップ⤴️'):cl(-6,w+'を選んだが…'+f+' チーム評価ダウン⤵️'),q=(p.ovr-60)/250;
 L.push(()=>set('⚽ 1点差のロスタイム、PKの場面。'+(gk?'相手キッカーがボールを置く。どちらに跳ぶ？':'キッカーを任された。どこに蹴る？'),gk?[['左に跳ぶ',()=>cr(.38+q,'左','PKを決められ敗戦…')],['右に跳ぶ',()=>cr(.38+q,'右','PKを決められ敗戦…')],['真ん中で待つ',()=>cr(.3+q,'真ん中','PKを決められ敗戦…')]]:[['左隅に蹴る',()=>cr(.72+q,'左隅','GKに止められ…')],['右隅に蹴る',()=>cr(.72+q,'右隅','GKに止められ…')],['真ん中に蹴る',()=>cr(.62+q,'真ん中','GKに読まれ…')]]));
 L.push(()=>{if(gk)return 0;const np=pk(NB[p.pos]);return set('🔁 監督から「'+np+'へのコンバート」を提案された。',[['受け入れる（'+np+'へ）',()=>{p.pos=np;p.ovr=Math.max(20,p.ovr-2);p.pot+=2;p.type=TY[np][0];cl(6,np+'へコンバート')}],['断る',()=>cl(-5,'コンバートを拒否')]])});
 L.push(()=>{const c=Object.keys(CT).filter(k=>CT[k].t<CT[p.league].t&&p.ovr>=TI[CT[k].t].thr-2&&p.cl>=2);if(!c.length)return 0;const k=pk(c),t=mk(k),s=offer(k,p.ovr,INFO[k+'|'+t].div)*1.4,y=RI(2,5);return set('💰 '+CT[k].fl+lgn(k,INFO[k+'|'+t].div)+'の'+t+'から'+ct(y,s)+'のオファー。移籍しますか？',[['移籍する',()=>{p.eval=C(p.eval-5,0,100);go(k,t,s,y,'ステップアップ移籍：'+lgn(k,INFO[k+'|'+t].div)+'・'+t)}],['残留する',()=>cl(3,'オファーを断り残留')]])});
 if(p.eval<35)L.push(()=>set('😠 出場機会に不満…移籍を志願しますか？',[['移籍を志願する',()=>market(Math.max(.042,offer(p.league,p.ovr)))],['我慢して続ける',()=>cl(-2,'我慢を選んだ')]]));
 L.push(()=>{if(p.age>31)return 0;trainEvt();return 1});
 for(const f of L.sort(()=>Math.random()-.5))if(f())return}
function proTurn(){if(p.nf>=3)return release('3年連続でほぼ出場機会なし');if(p.cl<=0)return renew();evt()}
function next(){
 if(p.over||p.pending)return;try{navigator.vibrate(30)}catch(e){}
 let l,team;p.was=p.stage;if(p.age>=50&&p.stage=='pro')return finish('50歳で現役引退');
 if(p.stage=='pro'){l=lvl(p.league,p.ovr,p.div);team=`${CT[p.league].fl} ${lgn(p.league,p.div)} ${p.team}（${l.l}）`;p.proYears++;p.money+=p.sal;p.cl--}
 else{l=S[p.stage];team=l.n+p.yr+'年'}
 const sn=season(l),h={age:p.age,ovr:p.ovr,team,s:sn,note:''},rj=Math.random()*(p.stage=='pro'?1:2),ij=rj<.008?['大怪我',10,0,'全休']:rj<.04?['怪我',5,.5,'半年離脱']:rj<.11?['小さな怪我',2,.9,'1か月離脱']:0;
 if(ij){scl(sn,ij[2]);h.note='🩹'+ij[0]+'（'+ij[3]+'）OVR-'+ij[1];p.log.unshift(p.age+'歳: '+ij[0]+'（'+ij[3]+'）');p.ovr=Math.max(20,p.ovr-ij[1])}

function rndAb(){const w=[0,0,0,0].map(()=>R(.5,1.5)),t=w.reduce((a,b)=>a+b,0),v=w.map(x=>C(Math.round(x/t*CAP),20,80));let q=v.reduce((a,b)=>a+b,0);while(q>CAP){v[v.indexOf(Math.max(...v))]--;q--}return v}

function start(){
 const c=$('#co').value,pot=C(Math.round(62+(Math.random()+Math.random()+Math.random()-1.5)*30),35,99),pos=$('#ps').value;
 p={country:c,name:$('#nm').value.trim()||genName(c),ft:$('#ft').value,pos,type:$('#tp').value,age:12,stage:'ms',yr:1,pot,ovr:Math.round(22+pot*.2+R(0,8)),peak:0,hist:[],log:['12歳: 中学・ジュニアユースに入団'],pending:null,over:false,proYears:0,role:0,eval:50,sal:0,cl:0,money:0,titles:0,tried:{},nf:0,caps:0,ng:0,wc:0,cc:0,div:0,cs:.5,adj:0};

function setup(){

function render(){

 <div style="text-align:right"><div class="ovr" style="color:${col}">${o}</div><div style="font-size:11px;color:var(--mu)">OVR（最高${p.peak}）</div></div></div><div class="bar"><i style="width:${o}%;background:${col}"></i></div></div>
